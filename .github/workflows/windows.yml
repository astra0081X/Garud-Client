name: windows

on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/windows.yml'

jobs:
  build:
    runs-on: windows-2019
    strategy:
      fail-fast: false
      matrix:
        config:
          - arch: Win32
            generator: "Visual Studio 16 2019"
            platform: "Win32"
            vcpkg_triplet: "x86-windows"
          - arch: x64
            generator: "Visual Studio 16 2019"
            platform: "x64"
            vcpkg_triplet: "x64-windows"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Clean Build Directory
        run: |
          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }
          New-Item -ItemType Directory -Path "build"
        shell: pwsh

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.3.1
        with:
          vs-version: '16.11'

      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
        shell: cmd

      - name: Install Dependencies
        run: |
          .\vcpkg\vcpkg install --triplet ${{ matrix.config.vcpkg_triplet }} ^
          irrlicht:${{ matrix.config.vcpkg_triplet }} ^
          zlib:${{ matrix.config.vcpkg_triplet }} ^
          curl[winssl]:${{ matrix.config.vcpkg_triplet }} ^
          openal-soft:${{ matrix.config.vcpkg_triplet }} ^
          libvorbis:${{ matrix.config.vcpkg_triplet }} ^
          libogg:${{ matrix.config.vcpkg_triplet }} ^
          sqlite3:${{ matrix.config.vcpkg_triplet }} ^
          freetype:${{ matrix.config.vcpkg_triplet }} ^
          luajit:${{ matrix.config.vcpkg_triplet }} ^
          jsoncpp:${{ matrix.config.vcpkg_triplet }}
        shell: cmd

      - name: Configure CMake
        run: |
          cmake -B build -S . ^
          -G "${{ matrix.config.generator }}" ^
          -A ${{ matrix.config.platform }} ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DCMAKE_TOOLCHAIN_FILE="%CD%/vcpkg/scripts/buildsystems/vcpkg.cmake" ^
          -DVCPKG_TARGET_TRIPLET=${{ matrix.config.vcpkg_triplet }} ^
          -DCMAKE_POLICY_DEFAULT_CMP0025=NEW ^
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ^
          -DRUN_IN_PLACE=ON ^
          -DBUILD_CLIENT=ON ^
          -DBUILD_SERVER=OFF ^
          -DENABLE_LUAJIT=ON ^
          -DREQUIRE_LUAJIT=ON ^
          -DCMAKE_VS_PLATFORM_TOOLSET=v142 ^
          -DCMAKE_SYSTEM_VERSION=10.0
        shell: cmd

      - name: Build
        run: |
          cmake --build build ^
          --config Release ^
          --parallel %NUMBER_OF_PROCESSORS% ^
          -- /p:Platform=${{ matrix.config.platform }} /p:Configuration=Release
        shell: cmd

      - name: Package
        working-directory: build
        run: cpack -G ZIP -C Release
        shell: cmd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: garud-client-${{ matrix.config.platform }}-windows
          path: build/_CPack_Packages/*/ZIP/*
          if-no-files-found: error
