name: windows

on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - '.github/workflows/windows.yml'
  pull_request:

jobs:
  build:
    runs-on: windows-2019
    strategy:
      matrix:
        arch: [x64, x86]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up MSVC
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: |
          .\vcpkg\vcpkg install --triplet ${{ matrix.arch }}-windows `
          irrlicht `
          zlib `
          curl[winssl] `
          openal-soft `
          libvorbis `
          libogg `
          sqlite3 `
          freetype `
          luajit `
          jsoncpp

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -A ${{ matrix.arch }} `
          -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -DRUN_IN_PLACE=ON `
          -DBUILD_CLIENT=ON

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Package
        run: |
          cd build
          cpack -G ZIP -B Package

      - uses: actions/upload-artifact@v4
        with:
          name: garud-client-${{ matrix.arch }}-windows
          path: build/Package/*
          if-no-files-found: error
