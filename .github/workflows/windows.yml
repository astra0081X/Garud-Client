name: windows

on:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - '.github/workflows/windows.yml'

jobs:
  msvc:
    name: VS 2019 ${{ matrix.config.arch }}-${{ matrix.type }}
    runs-on: windows-2019
    env:
      VCPKG_VERSION: 2024.02.01
      vcpkg_packages: >-
        zlib 
        zstd 
        curl[winssl] 
        openal-soft 
        libvorbis 
        libogg 
        libjpeg-turbo 
        sqlite3 
        freetype 
        luajit 
        gmp 
        jsoncpp 
        opengl-registry 
        irrlicht
      CMAKE_MINIMUM_REQUIRED_VERSION: 3.10
    strategy:
      fail-fast: false
      matrix:
        config:
          - {
              arch: x86,
              generator: "-G'Visual Studio 16 2019' -A Win32",
              vcpkg_triplet: x86-windows
            }
          - {
              arch: x64,
              generator: "-G'Visual Studio 16 2019' -A x64",
              vcpkg_triplet: x64-windows
            }
        type: [portable]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Restore from cache and run vcpkg
        uses: lukka/run-vcpkg@v7
        with:
          vcpkgArguments: ${{env.vcpkg_packages}}
          vcpkgDirectory: '${{ github.workspace }}\vcpkg'
          appendedCacheKey: ${{ matrix.config.vcpkg_triplet }}
          vcpkgGitCommitId: ${{ env.VCPKG_VERSION }}
          vcpkgTriplet: ${{ matrix.config.vcpkg_triplet }}

      - name: Create Build Directory
        run: mkdir build

      - name: CMake Configure
        working-directory: build
        run: |
          cmake .. ${{matrix.config.generator}} `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          -DENABLE_LUAJIT=TRUE `
          -DREQUIRE_LUAJIT=TRUE `
          -DCMAKE_POLICY_DEFAULT_CMP0025=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
          -DCMAKE_POLICY_DEFAULT_CMP0177=NEW `
          -DRUN_IN_PLACE=${{ contains(matrix.type, 'portable') }}

      - name: Build
        working-directory: build
        run: cmake --build . --config Release --parallel

      - name: Package
        working-directory: build
        run: |
          If ($env:TYPE -eq "portable")
          {
            cpack -G ZIP -B "$env:GITHUB_WORKSPACE\Package"
          }
          if (Test-Path "$env:GITHUB_WORKSPACE\Package\_CPack_Packages") {
            Remove-Item -Recurse -Force "$env:GITHUB_WORKSPACE\Package\_CPack_Packages"
          }
        env:
          TYPE: ${{matrix.type}}

      - uses: actions/upload-artifact@v4
        with:
          name: msvc-${{ matrix.config.arch }}-${{ matrix.type }}
          path: .\Package\
          if-no-files-found: error
